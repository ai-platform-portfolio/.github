name: Portfolio

on:
  pull_request:
    paths:
      - portfolio/**
      - profile/README.md
      - .github/workflows/portfolio.yml

  push:
    branches: [main]
    paths:
      - portfolio/**
      - .github/workflows/portfolio.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear:
    if: github.event_name == 'pull_request'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/linear-issue-check.yml@17a409d93bb7a8d697ee33690adfc96bc9a8651d
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}

  validate:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/validate.yml@4b8fe10ffffad31af9ee4766ab3ad7e72c2f76fa
    with:
      terraform-directories: '["portfolio/terraform"]'
      tofu-version: '1.13.9'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portfolio/image/requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r portfolio/image/requirements.txt

      - name: Verify cluster status boundaries
        run: python -m unittest discover -s portfolio/image -p 'test_*.py'

      - name: Check browser script
        run: node --check portfolio/image/static/app.js

  image:
    needs: [validate, test]

    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@17a409d93bb7a8d697ee33690adfc96bc9a8651d
    with:
      image: portfolio/site
      context: portfolio/image
      tag: ${{ github.event_name == 'pull_request' && format('preview-{0}-{1}', github.event.pull_request.number, github.sha) || '' }}
      publish-preview: true
      scan: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  infrastructure:
    needs: image
    # PRs plan their published digest. Main pushes publish only; deployment needs
    # an explicit manual run from main, so merging these PRs cannot deploy Azure.
    if: >-
      needs.image.outputs.digest != '' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@4b8fe10ffffad31af9ee4766ab3ad7e72c2f76fa
    with:
      root: portfolio/terraform
      tofu-version: '1.13.9'
      state-key: portfolio-hosting.tfstate
      variables: ${{ format('{{"image":"localacrk8s.azurecr.io/portfolio/site@{0}"}}', needs.image.outputs.digest) }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_RESOURCE_NAME: ${{ secrets.TF_BACKEND_RESOURCE_NAME }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
