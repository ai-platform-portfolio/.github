name: Profile quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: library-bin-placeholder/ops-shared/actions/workflow-lint@feac0efbe0f9910fb13e89c3da8698a92aa60423
  quality:
    if: always()
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.lint.result }}
        run: test "$RESULT" = success
